name: Deploy Staging
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build (staging)
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: bun run build

      - name: Deploy Edge Functions (staging)
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
        run: |
          npx supabase@latest functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy frontend to Hostinger (staging via FTP)
        if: ${{ secrets.STAGING_FTP_HOST != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STAGING_FTP_HOST }}
          username: ${{ secrets.STAGING_FTP_USER }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.STAGING_FTP_DIR || '/public_html/' }}

      - name: Smoke test
        if: ${{ vars.STAGING_URL != '' }}
        run: |
          for i in 1 2 3 4 5; do
            curl -sf "${{ vars.STAGING_URL }}" > /dev/null && exit 0
            sleep 5
          done
          echo "Smoke test failed" && exit 1
